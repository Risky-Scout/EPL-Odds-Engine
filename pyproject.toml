[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-pmf-backtest"
version = "0.3.0"
description = "Production research engine for EPL joint-PMF forecasting, walk-forward backtesting, and live in-play updates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "nbformat>=5.10",
    "penaltyblog>=1.5.1,<2.0",
    "scipy>=1.12,<=1.15.3",
]
authors = [
    { name = "Joseph Shackelford" }
]

[project.scripts]
epl-pmf = "epl_pmf_backtest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
